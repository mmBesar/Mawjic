<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Mawjic app icon</title>
  <desc id="desc">A flowing cyan-to-purple wave shaped like an M, with an integrated white play triangle, on a deep navy rounded square.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151a3c"/>
      <stop offset="0.55" stop-color="#090d22"/>
      <stop offset="1" stop-color="#120c2c"/>
    </linearGradient>
    <linearGradient id="wave" x1="0.08" y1="0.7" x2="0.9" y2="0.4">
      <stop offset="0" stop-color="#20d9f5"/>
      <stop offset="0.28" stop-color="#4386ff"/>
      <stop offset="0.55" stop-color="#9e4eff"/>
      <stop offset="0.77" stop-color="#ed4fd0"/>
      <stop offset="1" stop-color="#ff8b7b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.48" cy="0.47" r="0.7">
      <stop offset="0" stop-color="#693cff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#693cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="12" y="12" width="488" height="488" rx="116" fill="url(#bg)"/>
  <rect x="12.75" y="12.75" width="486.5" height="486.5" rx="115" fill="url(#glow)" stroke="#717aff" stroke-opacity="0.24" stroke-width="1.5"/>
  <path d="M 72 315 C 100 269, 129 166, 169 166 C 207 166, 222 276, 256 276 C 291 276, 310 166, 349 166 C 383 166, 401 255, 434 313"
        fill="none" stroke="url(#wave)" stroke-width="37" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)"/>
  <path d="M 91 363 C 135 394, 187 397, 229 372" fill="none" stroke="url(#wave)" stroke-width="13" stroke-linecap="round" opacity="0.88"/>
  <path d="M 303 328 L 303 384 Q 303 397 315 390 L 362 362 Q 373 355 362 348 L 315 321 Q 303 315 303 328 Z" fill="#f7f8ff" stroke="#f7f8ff" stroke-width="2" stroke-linejoin="round"/>
  <path d="M 371 88 A 34 34 0 0 1 398 115" fill="none" stroke="#b25cff" stroke-width="13" stroke-linecap="round"/>
  <path d="M 370 118 A 17 17 0 0 1 383 131" fill="none" stroke="#42dfff" stroke-width="11" stroke-linecap="round"/>
