name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate version tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          [[ "$TAG" == v* && "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag must look like v1.2.3" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux-packages:
    name: Linux ${{ matrix.arch }} release packages
    needs: validate-tag
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false
      - name: Install package inspection tools
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm binutils
      - name: Fetch and verify pinned AppImage tooling
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "APPIMAGETOOL_PATH=$(scripts/fetch-appimagetool.sh '${{ matrix.arch }}' "$RUNNER_TEMP")" >> "$GITHUB_ENV"
      - name: Build matching-architecture Linux packages
        env:
          VERSION_NAME: ${{ needs.validate-tag.outputs.version }}
        run: |
          set -euo pipefail
          ./gradlew --stacktrace \
            :composeApp:createDistributable \
            :composeApp:packageDeb \
            :composeApp:packageRpm \
            "-PversionName=$VERSION_NAME"
      - name: Stage and verify release assets
        shell: bash
        env:
          VERSION_NAME: ${{ needs.validate-tag.outputs.version }}
          TAG_NAME: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          app_root='composeApp/build/compose/binaries/main/app'
          if [[ ! -d "$app_root" ]]; then
            echo "Gradle did not create the jpackage app directory: $app_root" >&2
            find composeApp/build/compose/binaries/main -maxdepth 4 -print >&2 || true
            exit 1
          fi
          mkdir -p release-assets
          deb="$(find composeApp/build/compose/binaries/main/deb -type f -name '*.deb' -print -quit)"
          rpm_file="$(find composeApp/build/compose/binaries/main/rpm -type f -name '*.rpm' -print -quit)"
          test -s "$deb"
          test -s "$rpm_file"
          cp "$deb" "release-assets/mawjic-linux-${ARCH}-${TAG_NAME}.deb"
          cp "$rpm_file" "release-assets/mawjic-linux-${ARCH}-${TAG_NAME}.rpm"
          scripts/package-appimage.sh "$app_root" "$ARCH" "$TAG_NAME" "$APPIMAGETOOL_PATH" release-assets
          dpkg-deb --info "release-assets/mawjic-linux-${ARCH}-${TAG_NAME}.deb"
          rpm -qpi "release-assets/mawjic-linux-${ARCH}-${TAG_NAME}.rpm"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  android-release:
    name: Signed Android ARM64 release APK
    needs: validate-tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK / NDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false
      - name: Require and materialize release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then echo "Missing required Actions secret: $name" >&2; exit 1; fi
          done
          keystore="$RUNNER_TEMP/mawjic-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          test -s "$keystore"
          echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
      - name: Build signed release APK
        env:
          VERSION_NAME: ${{ needs.validate-tag.outputs.version }}
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew --stacktrace :composeApp:assembleRelease "-PversionName=$VERSION_NAME" "-PversionCode=$VERSION_CODE"
          mkdir -p release-assets
          APK="composeApp/build/outputs/apk/release/composeApp-release.apk"
          test -s "$APK"
          OUT="release-assets/mawjic-android-arm64-${GITHUB_REF_NAME}.apk"
          cp "$APK" "$OUT"
          scripts/verify-release-apk.sh "$OUT" "$VERSION_NAME" "$VERSION_CODE"
      - uses: actions/upload-artifact@v7
        with:
          name: android-arm64
          path: release-assets/*.apk
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release assets
    needs: [validate-tag, linux-packages, android-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Verify complete release contents
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          find release-assets -maxdepth 1 -type f -print
          for arch in amd64 arm64; do
            test -s "release-assets/mawjic-linux-${arch}-${TAG}.AppImage"
            test -s "release-assets/mawjic-linux-${arch}-${TAG}.deb"
            test -s "release-assets/mawjic-linux-${arch}-${TAG}.rpm"
          done
          test -s "release-assets/mawjic-android-arm64-${TAG}.apk"
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Mawjic ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
